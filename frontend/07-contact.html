<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - PawAI</title>
  <style>
    :root { --bg:#090a10; --panel:#141218; --line:#2d2833; --text:#f8f5fa; --muted:#9c96aa; --pink:#ff3d91; --pink-soft:#ff5aa4; --green:#2ee98f; --shadow:0 24px 70px rgba(0,0,0,.45); --pink-glow:0 18px 42px rgba(255,61,145,.28); --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 78% 8%, rgba(255,61,145,.18), transparent 34rem),linear-gradient(135deg,#08090f 0%,#121018 58%,#08090f 100%); font-family:var(--font); }
    a { color:inherit; text-decoration:none; }
    button,input,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    .page { width:min(900px,calc(100% - 40px)); margin:0 auto; padding:28px 0 44px; }
    .brand,.navbar,.actions { display:flex; align-items:center; }
    .navbar { justify-content:space-between; gap:18px; margin-bottom:34px; }
    .brand { gap:12px; font-size:24px; font-weight:900; }
    .brand-icon { display:grid; place-items:center; width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,var(--pink),var(--pink-soft)); box-shadow:var(--pink-glow); animation:logoPulse 3.8s ease-in-out infinite; }
    .brand-icon svg { width:24px; height:24px; fill:#fff; }
    .brand-accent { color:var(--pink); }
    .actions { gap:10px; flex-wrap:wrap; justify-content:flex-end; }
    .ghost-btn,.primary-btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 20px; border-radius:14px; font-weight:850; transition:transform .2s ease,box-shadow .2s ease; }
    .ghost-btn { border:1px solid rgba(255,61,145,.38); color:var(--pink); background:rgba(255,61,145,.1); }
    .primary-btn { color:#fff; background:linear-gradient(135deg,var(--pink),var(--pink-soft)); box-shadow:var(--pink-glow); }
    .ghost-btn:hover,.primary-btn:hover { transform:translateY(-2px); box-shadow:0 18px 42px rgba(255,61,145,.24); }
    .card { padding:34px; border:1px solid var(--line); border-radius:24px; background:rgba(20,18,24,.92); box-shadow:var(--shadow); animation:riseIn .72s ease both; }
    h1 { margin:0 0 12px; font-size:clamp(36px,6vw,58px); line-height:1; }
    p { margin-top:0; color:var(--muted); line-height:1.65; }
    form { display:grid; gap:16px; margin-top:24px; }
    label { display:grid; gap:8px; font-size:13px; font-weight:850; }
    input,textarea { width:100%; min-height:48px; padding:0 14px; border:1px solid #453545; border-radius:13px; outline:none; color:var(--text); background:#100f15; }
    textarea { min-height:130px; padding-top:14px; resize:vertical; }
    input:focus,textarea:focus { border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,61,145,.14); }
    .message { display:none; padding:12px 14px; border-radius:12px; color:var(--green); background:rgba(46,233,143,.1); border:1px solid rgba(46,233,143,.32); }
    .message.show { display:block; }
    @keyframes riseIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes logoPulse { 0%,100%{box-shadow:var(--pink-glow)} 50%{box-shadow:0 18px 54px rgba(255,61,145,.48),0 0 0 8px rgba(255,61,145,.08)} }
    @media (max-width:640px) { .navbar{align-items:flex-start;flex-direction:column}.actions,.ghost-btn,.primary-btn{width:100%}.card{padding:24px} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar">
      <a class="brand" href="index.html" aria-label="PawAI landing page"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.1 10.4c-1.4.2-2.6-1.1-2.8-2.9C5.1 5.7 6 4.1 7.3 3.9c1.4-.2 2.6 1.1 2.8 2.9.2 1.8-.7 3.4-2 3.6Zm7.8 0c-1.3-.2-2.2-1.8-2-3.6.2-1.8 1.4-3.1 2.8-2.9 1.3.2 2.2 1.8 2 3.6-.2 1.8-1.4 3.1-2.8 2.9ZM4.4 14.2c-1.1.4-2.4-.4-2.9-1.8-.5-1.4-.1-2.8 1-3.2 1.1-.4 2.4.4 2.9 1.8.5 1.4.1 2.8-1 3.2Zm15.2 0c-1.1-.4-1.5-1.8-1-3.2.5-1.4 1.8-2.2 2.9-1.8 1.1.4 1.5 1.8 1 3.2-.5 1.4-1.8 2.2-2.9 1.8Zm-7.6 6.2c-3.5 0-6.4-1.3-6.4-3.8 0-1.5 1.2-2.2 2.2-3 .8-.6 1.4-1.3 2.1-2.2.6-.8 1.2-1.3 2.1-1.3s1.5.5 2.1 1.3c.7.9 1.3 1.6 2.1 2.2 1 .8 2.2 1.5 2.2 3 0 2.5-2.9 3.8-6.4 3.8Z"/></svg></span>Paw<span class="brand-accent">AI</span></a>
      <nav class="actions"><a class="ghost-btn" href="08-help.html">Help</a><a class="ghost-btn" href="09-about-contact.html">About &amp; Contact</a><a class="primary-btn" href="01-create-account.html">Create Account</a></nav>
    </header>
    <main class="card">
      <h1>Contact Us</h1>
      <p>Use the complete PawAI contact form to send a message securely through the backend.</p>
      <p><a class="primary-btn" href="09-about-contact.html">Open About &amp; Contact</a></p>
      <form id="contactForm">
        <label>Name<input type="text" placeholder="Your name" required></label>
        <label>Email<input type="email" placeholder="you@example.com" required></label>
        <label>Message<textarea placeholder="How can we help?" required></textarea></label>
        <button class="primary-btn" type="submit">Send Message</button>
        <div id="contactMessage" class="message" role="status" aria-live="polite"></div>
      </form>
    </main>
  </div>
  <script>
    document.querySelector("#contactForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const message = document.querySelector("#contactMessage");
      message.textContent = "Support messaging is not available yet. Please try again once this feature is connected.";
      message.className = "message show";
    });
  </script>
  <script src="assets/js/api.js"></script>
</body>
</html>
