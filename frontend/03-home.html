<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home — PawAI</title><style>
:root{--pink:#ff3f8e;--pink2:#ff75ac;--soft:#fff1f7;--ink:#17182b;--muted:#77798e;--card:#fff;--line:#f0dce6;--shadow:0 18px 45px rgba(255,63,142,.12)}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff8fb,#ffeef6)}
body{min-height:100vh}.wrap{max-width:1400px;margin:auto;padding:28px 5vw}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.logo{font-size:30px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--pink)}.paw{color:var(--pink);font-size:28px}.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:800;cursor:pointer;font-size:15px}.btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:white;box-shadow:0 10px 25px rgba(255,63,142,.22)}.btn.ghost{background:white;border:1px solid #ffc2da;color:var(--pink)}.card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow)}input,select{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ff3f8e14}label{display:block;font-size:13px;font-weight:800;margin:0 0 8px}.muted{color:var(--muted)}.pink{color:var(--pink)}.grid{display:grid;gap:20px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.section-title{font-size:20px;margin:0 0 15px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#fff0f6;color:var(--pink);font-size:12px;font-weight:800}.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 8px 20px #ff3f8e20}.bottom{display:flex;gap:8px;justify-content:center;padding:16px;margin-top:20px;background:white;border-radius:20px;box-shadow:0 12px 30px #ff3f8e12}.bottom a{padding:10px 18px;border-radius:12px;color:#777;text-decoration:none;font-weight:700}.bottom a.active{background:#fff0f6;color:var(--pink)}
@media(max-width:900px){.two,.three,.four{grid-template-columns:1fr}.wrap{padding:20px}.nav{margin-bottom:22px}.hide-mobile{display:none!important}}
</style></head>
<body>
<div class="wrap">
  <div class="nav"><div><div class="logo">🐾 Paw<span>AI</span></div><div class="muted">Your Pet. Our AI. Better Care.</div></div><div style="display:flex;gap:10px;align-items:center"><img class="avatar" style="width:48px;height:48px" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=120&q=80"><button class="btn ghost">🔔</button></div></div>
  <div style="display:flex;justify-content:space-between;align-items:end;margin-bottom:22px"><div><span class="pill">Good morning 🐾</span><h1 style="font-size:42px;margin:10px 0 0">Hello, Whiskers!</h1></div><span class="pill">AI ready ●</span></div>
  <section class="card" style="padding:36px;text-align:center;position:relative;overflow:hidden">
    <div style="width:280px;height:280px;border-radius:50%;margin:auto;background:radial-gradient(circle,#ff3f8e 0,#ff75ac 45%,#ffe1ed 46%,#fff 70%);display:grid;place-items:center;box-shadow:0 0 0 16px #ff3f8e12,0 0 0 34px #ff3f8e08">
      <button class="btn" style="width:145px;height:145px;border-radius:50%;background:#fff;color:var(--pink);font-size:42px;box-shadow:0 18px 35px #ff3f8e28" data-action="Camera opened — connect getUserMedia/video recorder here.">📹</button>
    </div>
    <h2 style="font-size:28px;margin:20px 0 4px">Tap to Analyze</h2><p class="muted">Record your pet's behavior and let AI understand it.</p>
  </section>
  <div class="grid three" style="margin-top:20px">
    <button class="card btn" style="padding:24px" data-action="Open camera">📹<br><span style="font-size:18px">Camera</span><small class="muted"><br>Record Video</small></button>
    <button class="card btn" style="padding:24px" data-action="Open audio recorder">🎙️<br><span style="font-size:18px">Audio</span><small class="muted"><br>Upload / Record</small></button>
    <button class="card btn" style="padding:24px" data-action="Open file picker">🖼️<br><span style="font-size:18px">Gallery</span><small class="muted"><br>Image / Video</small></button>
  </div>
  <section class="card" style="padding:25px;margin-top:20px">
    <div style="display:flex;justify-content:space-between"><h2 class="section-title">Latest Analysis</h2><span class="pill">Video Analysis</span></div>
    <div style="display:flex;gap:20px;align-items:center"><img style="width:150px;height:110px;object-fit:cover;border-radius:16px" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=300&q=80"><div style="flex:1"><h3 style="margin:0 0 8px">Whiskers seems happy and playful. 😺</h3><p class="muted">2 May 2025 · 10:30 AM</p></div><button class="btn ghost" data-action="Playing AI speech output">🔊</button></div>
  </section>
  <div class="bottom"><a class="active" href="03-home.html">🏠 Home</a><a href="04-account.html">📜 History</a><a href="06-chatbot.html">💬 PawBot</a><a href="05-settings.html">⚙️ Account</a></div>
</div>

<script>
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>alert(b.dataset.action)));
</script>
</body></html>
