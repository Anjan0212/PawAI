<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — PawAI</title><style>
:root{--pink:#ff3f8e;--pink2:#ff75ac;--soft:#fff1f7;--ink:#17182b;--muted:#77798e;--card:#fff;--line:#f0dce6;--shadow:0 18px 45px rgba(255,63,142,.12)}
*{box-sizing:border-box}html,body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff8fb,#ffeef6)}
body{min-height:100vh}.wrap{max-width:1400px;margin:auto;padding:28px 5vw}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.logo{font-size:30px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--pink)}.paw{color:var(--pink);font-size:28px}.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:800;cursor:pointer;font-size:15px}.btn.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:white;box-shadow:0 10px 25px rgba(255,63,142,.22)}.btn.ghost{background:white;border:1px solid #ffc2da;color:var(--pink)}.card{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow)}input,select{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:15px;outline:none}input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ff3f8e14}label{display:block;font-size:13px;font-weight:800;margin:0 0 8px}.muted{color:var(--muted)}.pink{color:var(--pink)}.grid{display:grid;gap:20px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.four{grid-template-columns:repeat(4,1fr)}.section-title{font-size:20px;margin:0 0 15px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:#fff0f6;color:var(--pink);font-size:12px;font-weight:800}.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;border:4px solid white;box-shadow:0 8px 20px #ff3f8e20}.bottom{display:flex;gap:8px;justify-content:center;padding:16px;margin-top:20px;background:white;border-radius:20px;box-shadow:0 12px 30px #ff3f8e12}.bottom a{padding:10px 18px;border-radius:12px;color:#777;text-decoration:none;font-weight:700}.bottom a.active{background:#fff0f6;color:var(--pink)}
@media(max-width:900px){.two,.three,.four{grid-template-columns:1fr}.wrap{padding:20px}.nav{margin-bottom:22px}.hide-mobile{display:none!important}}
</style></head>
<body>
<div class="wrap">
  <div class="nav"><div class="logo">🐾 Paw<span>AI</span></div><a href="01-create-account.html" class="btn ghost">Create Account</a></div>
  <div style="min-height:78vh;display:grid;place-items:center">
    <section class="card" style="width:min(520px,100%);padding:42px">
      <div style="text-align:center"><div style="font-size:52px">🐾</div><h1 style="font-size:38px;margin:8px 0">Welcome Back!</h1><p class="muted">Login to continue your PawAI journey ❤️</p></div>
      <div style="margin-top:30px"><label>Username or Email</label><input placeholder="Enter your username or email"></div>
      <div style="margin-top:18px"><label>Password</label><input type="password" placeholder="Enter your password"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0"><label style="margin:0;display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto"> Remember me</label><a href="#" class="pink" data-action="Forgot password UI only — OTP/backend not connected.">Forgot Password?</a></div>
      <button class="btn primary" style="width:100%" data-action="Login clicked! Connect to authentication API.">🐾 Login</button>
      <div style="display:flex;align-items:center;gap:12px;margin:25px 0;color:#aaa"><hr style="flex:1;border:0;border-top:1px solid var(--line)">or continue with<hr style="flex:1;border:0;border-top:1px solid var(--line)"></div>
      <div class="grid three"><button class="btn ghost">Google</button><button class="btn ghost">Apple</button><button class="btn ghost">Facebook</button></div>
      <p style="text-align:center;margin-top:25px" class="muted">Don't have an account? <a class="pink" href="01-create-account.html"><b>Create Account</b></a></p>
    </section>
  </div>
</div>

<script>
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>alert(b.dataset.action)));
</script>
</body></html>
